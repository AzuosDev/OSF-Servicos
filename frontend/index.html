<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta
      name="description"
      content="MeuGasto ajuda voce a controlar gastos, orcamentos e metas financeiras."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="Public/favicon.svg" />

    <script>
      (function () {
        try {
          const theme =
            localStorage.getItem("theme") === "light" ? "light" : "dark";
          const root = document.documentElement;
          root.classList.add(theme);
          root.dataset.theme = theme;
          root.style.colorScheme = theme;

          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute(
              "content",
              theme === "light" ? "#f6f8f4" : "#0a0a0a",
            );
          }
        } catch (error) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <title>MeuGasto</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
